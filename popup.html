<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Wispr Flow to PiKVM</title>
    <style>
      body { width: 290px; margin: 0; padding: 16px; color: #202124; font: 13px system-ui, sans-serif; }
      h1 { margin: 0 0 14px; font-size: 16px; }
      .toggle { display: flex; align-items: center; gap: 8px; margin: 0; }
      .toggle input { margin: 0; }
      p { margin: 10px 0 0; color: #5f6368; line-height: 1.4; }
      #status { min-height: 18px; margin-top: 12px; color: #137333; }
    </style>
  </head>
  <body>
    <h1>Wispr Flow to PiKVM</h1>
    <label class="toggle">
      <input id="auto-keymap" type="checkbox">
      Automatically select PiKVM ru/en-us keymap
    </label>

    <p>This changes only PiKVM's <strong>using a host keymap</strong> selector.
      It never switches the keyboard layout on the remote computer.</p>
    <div id="status" role="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
